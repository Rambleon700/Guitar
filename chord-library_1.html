<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chord Library — Music Practice &amp; Theory Hub</title>
<style>
  :root{
    --bg1:#111215; --bg2:#181a20; --bg3:#242832;
    --amber:#f2a93b; --amber-glow:#ffe9cc;
    --wood:#4a3524; --wood-lt:#6b4d33;
    --text:#e8e4da; --text-dim:#9aa0ac;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--bg1); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
    padding-bottom:60px;
  }
  header{
    background:linear-gradient(180deg,var(--bg3),var(--bg2));
    border-bottom:3px solid var(--wood);
    padding:18px 16px 14px;
    text-align:center;
  }
  header h1{
    margin:0; font-size:22px; letter-spacing:0.5px; color:var(--amber-glow);
    text-shadow:0 0 12px rgba(242,169,59,0.35);
  }
  header p{margin:6px 0 0; font-size:13px; color:var(--text-dim);}

  .jumpwrap{max-width:520px; margin:14px auto 0; padding:0 14px; position:relative;}
  #jumpInput{
    width:100%; padding:11px 14px; font-size:16px; border-radius:10px;
    border:1px solid var(--wood-lt); background:var(--bg3); color:var(--text);
    outline:none;
  }
  #jumpInput:focus{border-color:var(--amber);}
  #jumpResults{
    position:absolute; left:14px; right:14px; top:46px; background:var(--bg3);
    border:1px solid var(--wood-lt); border-radius:8px; max-height:240px; overflow-y:auto;
    display:none; z-index:20; box-shadow:0 8px 20px rgba(0,0,0,0.5);
  }
  #jumpResults div{padding:9px 12px; cursor:pointer; font-size:14px; border-bottom:1px solid var(--bg2);}
  #jumpResults div:hover, #jumpResults div.active{background:var(--bg2); color:var(--amber);}

  .filterbar{
    display:flex; flex-wrap:wrap; gap:6px; justify-content:center;
    max-width:640px; margin:14px auto 0; padding:0 14px;
  }
  .chip{
    padding:6px 12px; border-radius:999px; background:var(--bg3); color:var(--text-dim);
    border:1px solid var(--wood); font-size:12.5px; cursor:pointer; user-select:none;
  }
  .chip.active{background:var(--amber); color:#20140a; border-color:var(--amber); font-weight:600;}

  .rootnav{
    position:sticky; top:0; z-index:15; display:flex; flex-wrap:wrap; gap:5px;
    justify-content:center; background:var(--bg1); padding:10px 12px; margin-top:12px;
    border-top:1px solid var(--wood); border-bottom:1px solid var(--wood);
  }
  .rootpill{
    padding:5px 10px; border-radius:6px; background:var(--bg2); color:var(--amber-glow);
    border:1px solid var(--wood-lt); font-size:13px; cursor:pointer; text-decoration:none;
  }
  .rootpill:hover{background:var(--bg3);}

  main{max-width:900px; margin:0 auto; padding:10px 12px;}
  .rootsection{margin-top:26px;}
  .rootsection h2{
    color:var(--amber); font-size:17px; border-bottom:1px solid var(--wood); padding-bottom:6px;
  }
  .chordgrid{display:flex; flex-wrap:wrap; gap:6px; margin-top:10px;}
  .chordbtn{
    padding:7px 11px; border-radius:7px; background:var(--bg2); color:var(--text);
    border:1px solid var(--wood-lt); font-size:13px; cursor:pointer;
  }
  .chordbtn:hover{background:var(--bg3); color:var(--amber-glow);}
  .chordbtn.sel{background:var(--amber); color:#20140a; border-color:var(--amber); font-weight:600;}

  #detail{
    position:fixed; left:0; right:0; bottom:0; background:var(--bg3);
    border-top:3px solid var(--wood); box-shadow:0 -8px 24px rgba(0,0,0,0.5);
    padding:14px 16px 16px; display:none; max-height:70vh; overflow-y:auto; z-index:30;
  }
  #detail.show{display:block;}
  .detailhead{display:flex; align-items:center; justify-content:space-between;}
  .detailhead h3{margin:0; color:var(--amber-glow); font-size:20px;}
  #closeDetail{
    background:none; border:1px solid var(--wood-lt); color:var(--text-dim);
    border-radius:6px; padding:4px 10px; cursor:pointer; font-size:13px;
  }
  .detailbody{display:flex; gap:20px; flex-wrap:wrap; margin-top:12px; align-items:flex-start;}
  .diagramwrap{flex:0 0 auto;}
  .infowrap{flex:1 1 180px; min-width:180px; order:2;}
  .infowrap table{border-collapse:collapse; font-size:13.5px;}
  .infowrap td{padding:3px 8px 3px 0; color:var(--text-dim);}
  .infowrap td.v{color:var(--text); font-weight:600;}
  .note{font-size:11.5px; color:var(--text-dim); margin-top:8px; max-width:280px;}

  .diagramwrap{
    display:flex; gap:12px; overflow-x:auto; flex:1 1 100%; order:1;
    padding-bottom:6px; -webkit-overflow-scrolling:touch;
  }
  .voicingcard{
    flex:0 0 auto; background:var(--bg2); border:1px solid var(--wood);
    border-radius:10px; padding:8px 8px 10px; text-align:center;
  }
  .voicinglabel{font-size:11.5px; color:var(--amber-glow); font-weight:600; margin-bottom:4px;}
  .playBtnSmall{
    margin-top:6px; padding:5px 12px; border-radius:7px; border:none;
    background:var(--amber); color:#20140a; font-weight:700; cursor:pointer; font-size:12.5px;
    display:block; width:100%;
  }
  .playBtnSmall:active{transform:translateY(1px);}

</header>

<script>
(function(){

  var STRING_OPEN_FREQ = [82.41, 110.00, 146.83, 196.00, 246.94, 329.63];
  var STRING_NAMES = ['E','A','D','G','B','e'];

  var CHORD_TYPES = [

  {s:'9b5', cat:'seventh', semis:[0,4,6,10,2], lab:['R','3','\u266d5','\u266d7','9'], req:[1,1,1,1,0]},
  {s:'aug9', cat:'seventh', semis:[0,4,8,10,2], lab:['R','3','#5','\u266d7','9'], req:[1,1,1,1,0]},
  {s:'7b9', cat:'seventh', semis:[0,4,7,10,1], lab:['R','3','5','\u266d7','\u266d9'], req:[1,1,0,1,1]},
  {s:'7#9', cat:'seventh', semis:[0,4,7,10,3], lab:['R','3','5','\u266d7','#9'], req:[1,1,0,1,1]},
  {s:'11', cat:'seventh', semis:[0,4,7,10,2,5], lab:['R','3','5','\u266d7','9','11'], req:[1,0,0,1,0,1]},
  {s:'9#11', cat:'seventh', semis:[0,4,7,10,2,6], lab:['R','3','5','\u266d7','9','#11'], req:[1,1,0,1,0,1]},
  {s:'13', cat:'seventh', semis:[0,4,7,10,2,5,9], lab:['R','3','5','\u266d7','9','11','13'], req:[1,1,0,1,0,0,1]},
  {s:'maj7', cat:'maj7', semis:[0,4,7,11], lab:['R','3','5','maj7'], req:[1,1,0,1]},
  {s:'maj7b5', cat:'maj7', semis:[0,4,6,11], lab:['R','3','\u266d5','maj7'], req:[1,1,1,1]},
  {s:'maj7#5', cat:'maj7', semis:[0,4,8,11], lab:['R','3','#5','maj7'], req:[1,1,1,1]},
  {s:'maj7sus2', cat:'maj7', semis:[0,2,7,11], lab:['R','2','5','maj7'], req:[1,1,0,1]},
  {s:'maj9', cat:'maj7', semis:[0,4,7,11,2], lab:['R','3','5','maj7','9'], req:[1,1,0,1,1]},
  {s:'maj11', cat:'maj7', semis:[0,4,7,11,2,5], lab:['R','3','5','maj7','9','11'], req:[1,0,0,1,0,1]},
  {s:'maj13', cat:'maj7', semis:[0,4,7,11,2,5,9], lab:['R','3','5','maj7','9','11','13'], req:[1,1,0,1,0,0,1]},
  {s:'m6', cat:'minor', semis:[0,3,7,9], lab:['R','\u266d3','5','6'], req:[1,1,0,1]},
  {s:'m7', cat:'minor', semis:[0,3,7,10], lab:['R','\u266d3','5','\u266d7'], req:[1,1,0,1]},
  {s:'m7b5', cat:'minor', semis:[0,3,6,10], lab:['R','\u266d3','\u266d5','\u266d7'], req:[1,1,1,1]},
  {s:'m9', cat:'minor', semis:[0,3,7,10,2], lab:['R','\u266d3','5','\u266d7','9'], req:[1,1,0,1,1]},
  {s:'m69', cat:'minor', semis:[0,3,7,9,2], lab:['R','\u266d3','5','6','9'], req:[1,1,0,1,1]},
  {s:'m11', cat:'minor', semis:[0,3,7,10,2,5], lab:['R','\u266d3','5','\u266d7','9','11'], req:[1,1,0,1,0,1]},
  {s:'m(maj7)', cat:'minor', semis:[0,3,7,11], lab:['R','\u266d3','5','maj7'], req:[1,1,0,1]},
  {s:'m(maj7b5)', cat:'minor', semis:[0,3,6,11], lab:['R','\u266d3','\u266d5','maj7'], req:[1,1,1,1]},
  {s:'m(maj9)', cat:'minor', semis:[0,3,7,11,2], lab:['R','\u266d3','5','maj7','9'], req:[1,1,0,1,1]},
  {s:'m(maj11)', cat:'minor', semis:[0,3,7,11,2,5], lab:['R','\u266d3','5','maj7','9','11'], req:[1,1,0,1,0,1]},
  {s:'add9', cat:'susadd', semis:[0,4,7,2], lab:['R','3','5','9'], req:[1,1,0,1]},
  {s:'add11', cat:'susadd', semis:[0,4,7,5], lab:['R','3','5','11'], req:[1,1,0,1]},
  {s:'madd9', cat:'susadd', semis:[0,3,7,2], lab:['R','\u266d3','5','9'], req:[1,1,0,1]}
  ];

  var CAT_LABEL = {major:'Major', minor:'Minor', seventh:'7th', maj7:'Maj7', susadd:'Sus/Add', dimaug:'Dim/Aug', other:'Other'};

  // ---------- Voicing engine ----------
  function candidateFretsInWindow(stringIdx, start, maxFret, allowedSet){
    var res=[];
    var openPc = STRING_OPEN_PC[stringIdx];
    if(allowedSet[openPc]) res.push(0);
    for(var f=Math.max(start,1); f<=maxFret; f++){
      var pc=(STRING_OPEN_PC[stringIdx]+f)%12;
      if(allowedSet[pc]) res.push(f);
    }
    return res;
  }

  function buildVoicingAtStart(requiredPcs, allowedSet, start, span){
    var maxFret = start+span;
    var assign = [-1,-1,-1,-1,-1,-1];
    var assignedPc = [null,null,null,null,null,null];
    var covered = {};
    var s, cands, c, f, pc, chosen, chosenPc;
    for(s=0;s<6;s++){
      cands = candidateFretsInWindow(s, start, maxFret, allowedSet);
      chosen=-1; chosenPc=null;
      for(c=0;c<cands.length;c++){
        f=cands[c]; pc=(STRING_OPEN_PC[s]+f)%12;
        if(requiredPcs[pc] && !covered[pc]){ chosen=f; chosenPc=pc; break; }
      }
      if(chosen===-1 && cands.length>0){ chosen=cands[0]; chosenPc=(STRING_OPEN_PC[s]+chosen)%12; }
      if(chosen!==-1){ assign[s]=chosen; assignedPc[s]=chosenPc; if(requiredPcs[chosenPc]) covered[chosenPc]=true; }
    }
    var pcKey;
    for(pcKey in requiredPcs){
      if(!requiredPcs.hasOwnProperty(pcKey)) continue;
      pc = parseInt(pcKey,10);
      if(!requiredPcs[pc] || covered[pc]) continue;
      for(s=0;s<6;s++){
        cands = candidateFretsInWindow(s, start, maxFret, allowedSet);
        var found=-1;
        for(c=0;c<cands.length;c++){ if((STRING_OPEN_PC[s]+cands[c])%12===pc){ found=cands[c]; break; } }
        if(found===-1) continue;
        var curPc = assignedPc[s];
        var curRequired = curPc!==null && requiredPcs[curPc];
        var curDuplicate=false;
        if(curRequired){
          var cnt=0, k;
          for(k=0;k<6;k++){ if(assignedPc[k]===curPc) cnt++; }
          if(cnt>1) curDuplicate=true;
        }
        if(!curRequired || curDuplicate || assign[s]===-1){
          assign[s]=found; assignedPc[s]=pc; covered[pc]=true;
          break;
        }
      }
    }
    return {assign:assign, assignedPc:assignedPc, covered:covered};
  }

  function scoreVoicing(v, start){
    var coveredCount=0, k;
    for(k in v.covered){ if(v.covered.hasOwnProperty(k) && v.covered[k]) coveredCount++; }
    var mutes=0, minF=99, maxF=-1;
    for(k=0;k<6;k++){
      if(v.assign[k]===-1) mutes++;
      else if(v.assign[k]>0){ if(v.assign[k]<minF)minF=v.assign[k]; if(v.assign[k]>maxF)maxF=v.assign[k]; }
    }
    var span = maxF>=0 ? (maxF-minF) : 0;
    return coveredCount*1000 - mutes*5 - start*2 - span*1;
  }

  function findVoicing(rootPc, chordType){
    var i, allowedSet={}, requiredPcs={};
    for(i=0;i<chordType.semis.length;i++){
      var pc=(rootPc+chordType.semis[i])%12;
      allowedSet[pc]=true;
      if(chordType.req[i]) requiredPcs[pc]=true;
    }
    var best=null, bestScore=-Infinity, bestStart=0;
    for(var start=0; start<=9; start++){
      var v = buildVoicingAtStart(requiredPcs, allowedSet, start, 3);
      var sc = scoreVoicing(v, start);
      if(sc>bestScore){ bestScore=sc; best=v; bestStart=start; }
    }
    return {voicing:best, start:bestStart};
  }

  // Finds several distinct, playable voicings spread up the fretboard (open position plus higher positions)
  function findAllVoicings(rootPc, chordType, maxStart){
    var i, allowedSet={}, requiredPcs={};
    for(i=0;i<chordType.semis.length;i++){
      var pc=(rootPc+chordType.semis[i])%12;
      allowedSet[pc]=true;
      if(chordType.req[i]) requiredPcs[pc]=true;
    }
    var candidates = [];
    var maxCoverage = -1;
    for(var start=0; start<=maxStart; start++){
      var v = buildVoicingAtStart(requiredPcs, allowedSet, start, 3);
      var coveredCount=0, k;
      for(k in v.covered){ if(v.covered.hasOwnProperty(k) && v.covered[k]) coveredCount++; }
      var sc = scoreVoicing(v, start);
      candidates.push({v:v, start:start, coveredCount:coveredCount, score:sc});
      if(coveredCount>maxCoverage) maxCoverage=coveredCount;
    }
    var good = candidates.filter(function(c){ return c.coveredCount===maxCoverage; });
    var seen = {};
    var deduped = [];
    good.forEach(function(c){
      var sig = c.v.assign.join(',');
      if(!seen[sig]){ seen[sig]=true; deduped.push(c); }
    });
    deduped.forEach(function(c){
      var minFret=99, s;
      for(s=0;s<6;s++){ if(c.v.assign[s]>0 && c.v.assign[s]<minFret) minFret=c.v.assign[s]; }
      c.minFret = minFret===99?0:minFret;
    });
    deduped.sort(function(a,b){ return a.start-b.start; });
    var selected = [];
    deduped.forEach(function(c){
      var last = selected[selected.length-1];
      if(!last || Math.abs(c.minFret-last.minFret)>=2){
        selected.push(c);
      }
    });
    if(selected.length>4) selected = selected.slice(0,4);
    if(selected.length===0 && deduped.length>0) selected=[deduped[0]];
    return selected;
  }

  // finger assignment heuristic
  function assignFingers(assign, start){
    var fingers = [null,null,null,null,null,null];
    var frets = [];
    var i;
    for(i=0;i<6;i++){ if(assign[i]>0) frets.push(assign[i]); }
    if(frets.length===0) return fingers;
    var minFret = Math.min.apply(null, frets);
    var barreStrings = [];
    for(i=0;i<6;i++){ if(assign[i]===minFret) barreStrings.push(i); }
    var nextFinger = 2;
    var usedFret = {};
    usedFret[minFret]=1;
    for(i=0;i<barreStrings.length;i++){ fingers[barreStrings[i]] = 1; }
    var remaining = [];
    for(i=0;i<6;i++){ if(assign[i]>0 && assign[i]!==minFret) remaining.push({s:i,f:assign[i]}); }
    remaining.sort(function(a,b){ return a.f-b.f; });
    for(i=0;i<remaining.length;i++){
      if(!usedFret[remaining[i].f] && nextFinger<=4){
        usedFret[remaining[i].f]=nextFinger;
      }
      fingers[remaining[i].s] = usedFret[remaining[i].f] || Math.min(4, nextFinger);
      if(usedFret[remaining[i].f]===nextFinger) nextFinger++;
    }
    return fingers;
  }

  // ---------- SVG chord diagram ----------
  function renderDiagramSVG(rootPc, v, start){
    var fingers = assignFingers(v.assign, start);

    var W = 170, H = 210;
    var leftPad = 28, topPad = 30, rightPad = 14, botPad = 20;
    var gridW = W - leftPad - rightPad;
    var gridH = H - topPad - botPad;
    var numFrets = 4;
    var stringGap = gridW/5;
    var fretGap = gridH/numFrets;

    var svg = '<svg width="'+W+'" height="'+H+'" viewBox="0 0 '+W+' '+H+'" xmlns="http://www.w3.org/2000/svg">';
    svg += '<rect x="0" y="0" width="'+W+'" height="'+H+'" fill="#181a20" rx="8"/>';

    // fret position label
    if(start>0){
      svg += '<text x="'+(leftPad-10)+'" y="'+(topPad+fretGap*0.7)+'" font-size="11" fill="#9aa0ac" text-anchor="end">'+(start+1)+'fr</text>';
    }

    // nut or top line
    if(start===0){
      svg += '<rect x="'+leftPad+'" y="'+(topPad-4)+'" width="'+gridW+'" height="5" fill="#e8e4da"/>';
    } else {
      svg += '<line x1="'+leftPad+'" y1="'+topPad+'" x2="'+(leftPad+gridW)+'" y2="'+topPad+'" stroke="#4a3524" stroke-width="2"/>';
    }

    // fret lines
    var fi;
    for(fi=0; fi<=numFrets; fi++){
      var y = topPad + fi*fretGap;
      svg += '<line x1="'+leftPad+'" y1="'+y+'" x2="'+(leftPad+gridW)+'" y2="'+y+'" stroke="#4a3524" stroke-width="1.5"/>';
    }
    // string lines
    var si;
    for(si=0; si<6; si++){
      var x = leftPad + si*stringGap;
      svg += '<line x1="'+x+'" y1="'+topPad+'" x2="'+x+'" y2="'+(topPad+gridH)+'" stroke="#6b4d33" stroke-width="1.5"/>';
    }

    // open/mute indicators above nut, string labels below
    for(si=0; si<6; si++){
      var x2 = leftPad + si*stringGap;
      var f = v.assign[si];
      if(f===-1){
        svg += '<text x="'+x2+'" y="'+(topPad-10)+'" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="bold">&#215;</text>';
      } else if(f===0){
        svg += '<circle cx="'+x2+'" cy="'+(topPad-11)+'" r="4.5" fill="none" stroke="#e8e4da" stroke-width="1.5"/>';
      }
      svg += '<text x="'+x2+'" y="'+(H-6)+'" font-size="9.5" fill="#9aa0ac" text-anchor="middle">'+STRING_NAMES[si]+'</text>';
    }

    // finger dots
    var rootPcSet = (rootPc);
    for(si=0; si<6; si++){
      var f2 = v.assign[si];
      if(f2>0){
        var relFret = f2 - start;
        var cx = leftPad + si*stringGap;
        var cy = topPad + (relFret-0.5)*fretGap;
        var pc = (STRING_OPEN_PC[si]+f2)%12;
        var isRoot = (pc===rootPcSet);
        var fillColor = isRoot ? '#f2a93b' : '#ffe9cc';
        svg += '<circle cx="'+cx+'" cy="'+cy+'" r="9" fill="'+fillColor+'" stroke="#20140a" stroke-width="1"/>';
        var fingerNum = fingers[si];
        if(fingerNum){
          svg += '<text x="'+cx+'" y="'+(cy+3.5)+'" font-size="10" fill="#20140a" text-anchor="middle" font-weight="bold">'+fingerNum+'</text>';
        }
      }
    }

    svg += '</svg>';
    return svg;
  }

  // ---------- Audio (Karplus-Strong) ----------
  var audioCtx = null;
  function getCtx(){
    if(!audioCtx){
      var AC = window.AudioContext || window.webkitAudioContext;
      audioCtx = new AC();
    }
    return audioCtx;
  }

  function pluckBuffer(ctx, freq){
    var sr = ctx.sampleRate;
    var dur = 2.2;
    var n = Math.round(sr/freq);
    var len = Math.floor(sr*dur);
    var buffer = ctx.createBuffer(1, len, sr);
    var data = buffer.getChannelData(0);
    var i;
    for(i=0;i<n;i++){ data[i] = Math.random()*2-1; }
    var decay = 0.996;
    for(i=n;i<len;i++){
      data[i] = decay * 0.5 * (data[i-n] + data[i-n+1 < len ? i-n+1 : i-n]);
    }
    return buffer;
  }

  function playChord(assign){
    var ctx = getCtx();
    if(ctx.state==='suspended') ctx.resume();
    var now = ctx.currentTime;
    var strIdx = 0;
    for(var i=0;i<6;i++){
      if(assign[i]===-1) continue;
      var freq = STRING_OPEN_FREQ[i]*Math.pow(2, assign[i]/12);
      var buf = pluckBuffer(ctx, freq);
      var src = ctx.createBufferSource();
      src.buffer = buf;
      var gain = ctx.createGain();
      gain.gain.value = 0.22;
      src.connect(gain);
      gain.connect(ctx.destination);
      src.start(now + strIdx*0.028);
      strIdx++;
    }
  }

  // ---------- UI wiring ----------
  var currentCat = 'all';
  var mainEl = document.getElementById('main');
  var rootnavEl = document.getElementById('rootnav');

  ROOTS.forEach(function(r){
    var a = document.createElement('a');
    a.className = 'rootpill';
    a.href = '#root-'+r.pc;
    a.textContent = r.name;
    rootnavEl.appendChild(a);
  });

  function noteNameFor(rootPc){
    var arr = FLAT_ROOTS[rootPc] ? NOTE_FLAT : NOTE_SHARP;
    return arr;
  }

  function chordSymbol(rootName, type){ return rootName + type.s; }

  function buildGrid(){
    mainEl.innerHTML = '';
    ROOTS.forEach(function(r){
      var visibleTypes = CHORD_TYPES.filter(function(t){ return currentCat==='all' || t.cat===currentCat; });
      if(visibleTypes.length===0) return;
      var section = document.createElement('div');
      section.className = 'rootsection';
      section.id = 'root-'+r.pc;
      var h2 = document.createElement('h2');
      h2.textContent = r.name + ' Chords';
      section.appendChild(h2);
      var grid = document.createElement('div');
      grid.className = 'chordgrid';
      visibleTypes.forEach(function(t){
        var btn = document.createElement('div');
        btn.className = 'chordbtn';
        btn.textContent = chordSymbol(r.name, t);
        btn.onclick = function(){ showDetail(r, t, btn); };
        grid.appendChild(btn);
      });
      section.appendChild(grid);
      mainEl.appendChild(section);
    });
  }

  var lastActiveBtn = null;
  function showDetail(root, type, btnEl){
    if(lastActiveBtn) lastActiveBtn.classList.remove('sel');
    if(btnEl){ btnEl.classList.add('sel'); lastActiveBtn = btnEl; }

    var symbol = chordSymbol(root.name, type);
    document.getElementById('detailTitle').textContent = symbol;

    var voicings = findAllVoicings(root.pc, type, 12);
    var diagramWrap = document.getElementById('diagramWrap');
    diagramWrap.innerHTML = '';
    voicings.forEach(function(vc){
      var card = document.createElement('div');
      card.className = 'voicingcard';
      var label = document.createElement('div');
      label.className = 'voicinglabel';
      label.textContent = vc.start===0 ? 'Open position' : (vc.start+1)+'th fret';
      card.appendChild(label);
      var svgHolder = document.createElement('div');
      svgHolder.innerHTML = renderDiagramSVG(root.pc, vc.v, vc.start);
      card.appendChild(svgHolder);
      var pBtn = document.createElement('button');
      pBtn.className = 'playBtnSmall';
      pBtn.textContent = '\u25b6 Play';
      pBtn.onclick = function(){ playChord(vc.v.assign); };
      card.appendChild(pBtn);
      diagramWrap.appendChild(card);
    });

    var names = noteNameFor(root.pc);
    var noteList = type.semis.map(function(s){ return names[(root.pc+s)%12]; });
    var intervalList = type.lab.join(', ');

    var table = document.getElementById('infoTable');
    table.innerHTML =
      '<tr><td>Notes</td><td class="v">'+noteList.join(' \u2013 ')+'</td></tr>'+
      '<tr><td>Intervals</td><td class="v">'+intervalList+'</td></tr>'+
      '<tr><td>Positions</td><td class="v">'+voicings.length+' shown across the neck</td></tr>';

    var approxNote = document.getElementById('approxNote');
    approxNote.textContent = (type.s==='alt') ? 'Altered dominant — voicing shown is a practical approximation (root, 3rd, \u266d5, \u266d7); full jazz "alt" theory includes further tension notes.' : '';

    document.getElementById('detail').classList.add('show');
    adjustBodyPadding();
  }

  function adjustBodyPadding(){
    var detailEl = document.getElementById('detail');
    if(detailEl.classList.contains('show')){
      var h = detailEl.offsetHeight;
      document.body.style.paddingBottom = (h + 24) + 'px';
    } else {
      document.body.style.paddingBottom = '60px';
    }
  }

  document.getElementById('closeDetail').onclick = function(){
    document.getElementById('detail').classList.remove('show');
    adjustBodyPadding();
  };

  // filter chips
  document.getElementById('filterbar').addEventListener('click', function(e){
    var chip = e.target.closest ? e.target.closest('.chip') : null;
    if(!chip) return;
    var chips = document.querySelectorAll('.chip');
    for(var i=0;i<chips.length;i++){ chips[i].classList.remove('active'); }
    chip.classList.add('active');
    currentCat = chip.getAttribute('data-cat');
    buildGrid();
  });

  // quick jump search
  var jumpInput = document.getElementById('jumpInput');
  var jumpResults = document.getElementById('jumpResults');

  var ALL_CHORDS = [];
  ROOTS.forEach(function(r){
    CHORD_TYPES.forEach(function(t){
      ALL_CHORDS.push({root:r, type:t, symbol: chordSymbol(r.name, t)});
    });
  });

  function normalize(s){ return s.toLowerCase().replace(/[\s]/g,''); }

  jumpInput.addEventListener('input', function(){
    var q = normalize(jumpInput.value);
    if(!q){ jumpResults.style.display='none'; jumpResults.innerHTML=''; return; }
    var matches = ALL_CHORDS.filter(function(c){ return normalize(c.symbol).indexOf(q)===0; });
    if(matches.length===0){ matches = ALL_CHORDS.filter(function(c){ return normalize(c.symbol).indexOf(q)!==-1; }); }
    matches = matches.slice(0,12);
    if(matches.length===0){ jumpResults.style.display='none'; jumpResults.innerHTML=''; return; }
    jumpResults.innerHTML='';
    matches.forEach(function(m){
      var div = document.createElement('div');
      div.textContent = m.symbol;
      div.onclick = function(){
        jumpInput.value='';
        jumpResults.style.display='none';
        currentCat='all';
        var chips = document.querySelectorAll('.chip');
        for(var i=0;i<chips.length;i++){ chips[i].classList.remove('active'); }
        document.querySelector('.chip[data-cat="all"]').classList.add('active');
        buildGrid();
        setTimeout(function(){
          showDetail(m.root, m.type, null);
          document.getElementById('root-'+m.root.pc).scrollIntoView({behavior:'smooth', block:'start'});
        }, 30);
      };
      jumpResults.appendChild(div);
    });
    jumpResults.style.display='block';
  });

  jumpInput.addEventListener('keydown', function(e){
    if(e.key==='Enter'){
      var first = jumpResults.querySelector('div');
      if(first) first.click();
    }
  });

  document.addEventListener('click', function(e){
    if(e.target!==jumpInput && !jumpResults.contains(e.target)){
      jumpResults.style.display='none';
    }
  });

  buildGrid();
  window.addEventListener('resize', adjustBodyPadding);
})();
</script>
</body>
</html>
